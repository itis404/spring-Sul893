<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title layout:fragment="title">Edit Post - PrivetMedved</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-container">
            <h1>Edit Post</h1>
            <form th:action="@{/posts/{id}/edit(id=${post.id})}" th:object="${postForm}" method="post">
                <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" th:field="*{title}" required>
                    <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                </div>
                <div class="form-group">
                    <label for="content">Content</label>
                    <textarea id="content" th:field="*{content}" rows="10" required></textarea>
                    <span class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
            </form>
        </div>
    </div>
</body>
</html>
