<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title layout:fragment="title">Rooms - PrivetMedved</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="page-header">
            <h1>Rooms</h1>
            <a th:href="@{/rooms/create}" class="btn btn-primary">Create Room</a>
        </div>

        <div class="room-grid">
            <div class="room-card" th:each="room : ${rooms}">
                <h3><a th:href="@{/rooms/{slug}(slug=${room.slug})}" th:text="${room.name}">Room</a></h3>
                <p th:text="${room.description}" th:if="${room.description}">Description</p>
                <div class="room-meta">
                    <span th:text="'by ' + ${room.creator.username}">creator</span>
                    <span th:text="${room.participants.size()} + ' members'">members</span>
                </div>
            </div>
        </div>

        <div th:if="${popularRooms != null && !popularRooms.isEmpty()}">
            <h2 class="section-title">Popular Rooms</h2>
            <div class="room-grid">
                <div class="room-card room-card-highlight" th:each="room : ${popularRooms}">
                    <h3><a th:href="@{/rooms/{slug}(slug=${room.slug})}" th:text="${room.name}">Room</a></h3>
                    <div class="room-meta">
                        <span th:text="${room.participants.size()} + ' members'">members</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
