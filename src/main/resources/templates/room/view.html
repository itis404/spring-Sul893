<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title layout:fragment="title" th:text="${room.name} + ' - PrivetMedved'">Room</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="room-header">
            <h1 th:text="${room.name}">Room Name</h1>
            <p class="room-description" th:text="${room.description}">Description</p>
            <div class="room-stats">
                <span th:text="${room.participants.size()} + ' members'">0 members</span>
                <span th:text="'Created by ' + ${room.creator.username}">creator</span>
            </div>

            <div class="room-actions">
                <span sec:authorize="isAuthenticated()">
                    <form th:if="${!isMember}" th:action="@{/rooms/{slug}/join(slug=${room.slug})}" method="post" style="display:inline">
                        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                        <button type="submit" class="btn btn-primary">Join Room</button>
                    </form>
                    <form th:if="${isMember}" th:action="@{/rooms/{slug}/leave(slug=${room.slug})}" method="post" style="display:inline">
                        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                        <button type="submit" class="btn btn-outline">Leave Room</button>
                    </form>
                </span>
                <a th:href="@{/posts/create(roomId=${room.id})}" class="btn btn-primary" sec:authorize="isAuthenticated()">New Post</a>
            </div>
        </div>

        <div class="post-list">
            <div class="post-item" th:each="post : ${posts.content}">
                <div class="post-votes" th:attr="data-post-id=${post.id}">
                    <button class="vote-btn vote-up" onclick="votePost(this, 1)">&#9650;</button>
                    <span class="vote-count" th:text="${post.voteCount}">0</span>
                    <button class="vote-btn vote-down" onclick="votePost(this, -1)">&#9660;</button>
                </div>
                <div class="post-content">
                    <h3><a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}">Title</a></h3>
                    <div class="post-meta">
                        <span th:text="'Posted by ' + ${post.authorUsername} + ' • ' + ${#temporals.format(post.createdAt, 'dd.MM.yyyy HH:mm')}">meta</span>
                        <span th:if="${post.pinned}" class="badge badge-pinned">Pinned</span>
                        <span th:text="${post.commentCount} + ' comments'">0 comments</span>
                    </div>
                    <div class="post-tags" th:if="${!post.tags.isEmpty()}">
                        <span class="tag" th:each="tag : ${post.tags}" th:text="${tag}">tag</span>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${posts.totalPages > 1}" class="pagination">
            <a th:if="${!posts.first}" th:href="@{/rooms/{slug}(slug=${room.slug}, page=${posts.number - 1})}">Previous</a>
            <span th:text="'Page ' + ${posts.number + 1} + ' of ' + ${posts.totalPages}">Page</span>
            <a th:if="${!posts.last}" th:href="@{/rooms/{slug}(slug=${room.slug}, page=${posts.number + 1})}">Next</a>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            function votePost(button, value) {
                var postContainer = button.closest('.post-votes');
                var postId = postContainer.getAttribute('data-post-id');
                if (!postId) return;

                fetch('/api/posts/' + postId + '/vote?value=' + value, { method: 'POST' })
                    .then(function(r) { if (r.ok) return r.json(); else throw r; })
                    .then(function(cnt) {
                        var el = postContainer.querySelector('.vote-count');
                        if (el) el.textContent = cnt;
                    })
                    .catch(function(e) { console.error(e); });
            }
        </script>
    </th:block>
</body>
</html>
