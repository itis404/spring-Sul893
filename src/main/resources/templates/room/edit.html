<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title layout:fragment="title">Edit Room - PrivetMedved</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-container">
            <h1>Edit Room</h1>
            <form th:action="@{/rooms/{slug}/edit(slug=${room.slug})}" th:object="${roomForm}" method="post">
                <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                <div class="form-group">
                    <label for="name">Room Name</label>
                    <input type="text" id="name" th:field="*{name}" required>
                    <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                </div>
                <div class="form-group">
                    <label for="slug">URL Slug</label>
                    <input type="text" id="slug" th:field="*{slug}" required>
                    <span class="error" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></span>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" th:field="*{description}" rows="5"></textarea>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" th:field="*{private}"> Private Room
                    </label>
                </div>
                <div class="form-group">
                    <label for="maxParticipants">Max Participants</label>
                    <input type="number" id="maxParticipants" th:field="*{maxParticipants}" min="2">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
            </form>

            <form th:action="@{/rooms/{slug}/delete(slug=${room.slug})}" method="post" onsubmit="return confirm('Delete this room? This cannot be undone.')" style="margin-top:20px">
                <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                <button type="submit" class="btn btn-danger btn-block">Delete Room</button>
            </form>
        </div>
    </div>
</body>
</html>
