<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
    <title th:text="${title} ?: 'PrivetMedved'">PrivetMedved</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <th:block layout:fragment="head-extra"></th:block>
</head>
<body>
    <th:block th:replace="~{fragments/header :: header}"></th:block>

    <main class="container">
        <aside class="sidebar">
            <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>
        </aside>

        <div class="content">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div th:if="${loginError}" class="alert alert-error" th:text="${loginError}"></div>

            <th:block layout:fragment="content"></th:block>
        </div>
    </main>

    <footer class="footer">
        <p>2026 PrivetMedved</p>
    </footer>

    <script th:src="@{/js/main.js?v=2}"></script>
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
