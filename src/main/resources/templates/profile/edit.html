<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title layout:fragment="title">Edit Profile - PrivetMedved</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-container">
            <h1>Edit Profile</h1>
            <form th:action="@{/profile/edit}" th:object="${profileForm}" method="post">
                <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                <div class="form-group">
                    <label for="displayName">Display Name</label>
                    <input type="text" id="displayName" th:field="*{displayName}">
                </div>
                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" th:field="*{bio}" rows="4"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group form-group-half">
                        <label for="backgroundColor">Background Color</label>
                        <input type="color" id="backgroundColor" th:field="*{backgroundColor}">
                    </div>
                    <div class="form-group form-group-half">
                        <label for="textColor">Text Color</label>
                        <input type="color" id="textColor" th:field="*{textColor}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group form-group-half">
                        <label for="accentColor">Accent Color</label>
                        <input type="color" id="accentColor" th:field="*{accentColor}">
                    </div>
                    <div class="form-group form-group-half">
                        <label for="fontFamily">Font Family</label>
                        <input type="text" id="fontFamily" th:field="*{fontFamily}" placeholder="Arial, sans-serif">
                    </div>
                </div>
                <div class="form-group">
                    <label for="backgroundImageUrl">Background Image URL</label>
                    <input type="url" id="backgroundImageUrl" th:field="*{backgroundImageUrl}">
                </div>
                <div class="form-group">
                    <label for="profileLayout">Profile Layout</label>
                    <select id="profileLayout" th:field="*{profileLayout}">
                        <option value="default">Default</option>
                        <option value="centered">Centered</option>
                        <option value="sidebar">Sidebar</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="customCss">Custom CSS</label>
                    <textarea id="customCss" th:field="*{customCss}" rows="6" placeholder=".profile-page { ... }"></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Save Profile</button>
            </form>
        </div>
    </div>
</body>
</html>
