server:
  port: 8080

spring:
  application:
    name: privetmedved

  datasource:
    url: jdbc:postgresql://localhost:5432/privetmedved
    username: postgres
    password: 20170927s
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  cache:
    type: redis
    redis:
      time-to-live: 600000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

external:
  currency:


logging:
  level:
    root: INFO
    com.privetmedved: DEBUG
    org.springframework.data.redis: DEBUG
    io.lettuce.core: DEBUG
  file:
    name: logs/privetmedved.log