<header class="main-header" xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="header-container">
        <a th:href="@{/}" class="logo">
            <span class="logo-text">PrivetMedved</span>
        </a>

        <button class="mobile-menu-toggle" onclick="document.querySelector('.main-nav').classList.toggle('open')">
            <span></span><span></span><span></span>
        </button>

        <nav class="main-nav">
            <a th:href="@{/}">Home</a>
            <a th:href="@{/rooms}">Rooms</a>
            <a th:href="@{/posts}">Posts</a>
            <span sec:authorize="isAuthenticated()">
                <a th:href="@{/chat}">Chats</a>
                <a th:href="@{/profile}">Profile</a>
            </span>
            <span sec:authorize="!isAuthenticated()">
                <a th:href="@{/auth/login}">Login</a>
                <a th:href="@{/auth/register}">Register</a>
            </span>
        </nav>

        <div class="header-actions">
            <span sec:authorize="isAuthenticated()">
                <span class="user-greeting" sec:authentication="name"></span>
                <a th:href="@{/profile}" class="btn btn-outline btn-sm">Profile</a>
                <form th:action="@{/auth/logout}" method="post" style="display:inline">
                    <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                    <button type="submit" class="btn btn-outline btn-sm">Logout</button>
                </form>
            </span>
            <span sec:authorize="!isAuthenticated()">
                <a th:href="@{/auth/login}" class="btn btn-outline btn-sm">Login</a>
                <a th:href="@{/auth/register}" class="btn btn-primary btn-sm">Register</a>
            </span>
        </div>
    </div>
</header>
