<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title layout:fragment="title" th:text="${post.title} + ' - PrivetMedved'">Post</title>
</head>
<body>
    <div layout:fragment="content">
        <article class="post-detail">
            <h1 th:text="${post.title}">Title</h1>
            <div class="post-meta">
                <span th:text="'Posted by ' + ${post.author.username} + ' • ' + ${#temporals.format(post.createdAt, 'dd.MM.yyyy HH:mm')}">meta</span>
                <span th:if="${post.updatedAt != null}" th:text="'Updated: ' + ${#temporals.format(post.updatedAt, 'dd.MM.yyyy HH:mm')}">updated</span>
            </div>
            <div class="post-tags" th:if="${!post.tags.isEmpty()}">
                <span class="tag" th:each="tag : ${post.tags}" th:text="${tag.name}">tag</span>
            </div>
            <div class="post-body" th:utext="${#strings.escapeXml(post.content)}" style="white-space: pre-wrap;"></div>

            <div class="post-actions" sec:authorize="isAuthenticated()">
                <a th:if="${canEdit}" th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn btn-outline">Edit</a>
                <form th:if="${canEdit}" th:action="@{/posts/{id}/delete(id=${post.id})}" method="post"
                      onsubmit="return confirm('Delete this post?')" style="display:inline">
                    <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </div>
        </article>

        <section class="comments-section">
            <h2>Comments</h2>
            <div class="comment" th:each="comment : ${comments}">
                <div class="comment-meta">
                    <strong th:text="${comment.author.username}">author</strong>
                    <span th:text="${#temporals.format(comment.createdAt, 'dd.MM.yyyy HH:mm')}">date</span>
                </div>
                <div class="comment-body" th:text="${comment.content}">content</div>
            </div>

            <div sec:authorize="isAuthenticated()">
                <h3>Add a comment</h3>
                <div class="comment-form" id="comment-form">
                    <div class="form-group">
                        <textarea id="comment-content" rows="3" required minlength="1"></textarea>
                    </div>
                    <button type="button" class="btn btn-primary" onclick="doSendComment(this)">Post Comment</button>
                </div>
            </div>
        </section>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            function doSendComment(button) {
                var form = button.closest('.comment-form');
                var textarea = form.querySelector('textarea');
                var content = textarea.value.trim();
                if (!content) return;

                var postId = window.location.pathname.split('/').pop();

                fetch('/api/posts/' + postId + '/comments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                }).then(function(response) {
                    if (response.ok) location.reload();
                    else response.json().then(function(d) { alert(d.message || 'Error'); });
                }).catch(function(err) { console.error(err); });
            }
        </script>
    </th:block>
</body>
</html>
