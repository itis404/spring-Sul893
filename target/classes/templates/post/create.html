<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title layout:fragment="title">Create Post - PrivetMedved</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-container">
            <h1>Create Post</h1>
            <form th:action="@{/posts/create}" th:object="${postForm}" method="post">
                <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                <div class="form-group">
                    <label for="roomId">Room</label>
                    <select id="roomId" th:field="*{roomId}" required>
                        <option value="">Select a room</option>
                        <option th:each="room : ${rooms}" th:value="${room.id}" th:text="${room.name}">Room</option>
                    </select>
                    <span class="error" th:if="${#fields.hasErrors('roomId')}" th:errors="*{roomId}"></span>
                </div>
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" th:field="*{title}" required>
                    <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                </div>
                <div class="form-group">
                    <label for="content">Content</label>
                    <textarea id="content" th:field="*{content}" rows="10" required></textarea>
                    <span class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></span>
                </div>
                <div class="form-group">
                    <label for="tags">Tags (comma-separated)</label>
                    <input type="text" id="tags" placeholder="e.g. java, spring, web">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Create Post</button>
            </form>
        </div>
    </div>
</body>
</html>
